name: hi_class_app
description: "هاي كلاس - نظام إدارة المشاريع (Hi Class Project Management)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/hi_class_app_icon.png"
  adaptive_icon_background: "#6B1D30"
  adaptive_icon_foreground: "assets/icons/hi_class_app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#6B1D30"
  image: "assets/splash/hi_class_safe_splash.png"
  android: true
  ios: false
  web: false
  android_12:
    color: "#6B1D30"
    image: "assets/splash/hi_class_safe_splash.png"

flutter:
  uses-material-design: true
  assets:
       - assets/images/hi_class_login_background.jfif



